<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aliasing face v0.3</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#888}a:hover{color:#aaa}
.al-btn{all:unset;box-sizing:border-box;cursor:pointer;touch-action:none;display:block}
.al-btn:focus-visible{outline:1px solid #8fa6b6;outline-offset:1px}
</style>
</helmet>
<div style="position: relative; width: 968px; height: 169px; overflow: hidden; font-family: Inter, 'Ableton Sans', system-ui, sans-serif; font-size: 9px; background: {{c.bg}}; color: {{c.text}}; user-select: none">

  <sc-for list="{{panels}}" as="pn" hint-placeholder-count="4">
    <div style="position: absolute; left: {{pn.x}}px; top: {{pn.y}}px; width: {{pn.w}}px; height: {{pn.h}}px; border-radius: 4px; background: {{pn.bg}}"></div>
  </sc-for>

  <sc-for list="{{vlines}}" as="vl" hint-placeholder-count="0">
    <div style="position: absolute; left: {{vl.x}}px; top: {{vl.y}}px; width: 1px; height: {{vl.h}}px; background: {{c.rule}}"></div>
  </sc-for>

  <sc-for list="{{labels}}" as="lb" hint-placeholder-count="20">
    <div style="position: absolute; left: {{lb.x}}px; top: {{lb.y}}px; width: {{lb.w}}px; height: {{lb.h}}px; line-height: {{lb.lh}}px; font-size: {{lb.fs}}px; font-weight: {{lb.fw}}; letter-spacing: {{lb.ls}}; text-align: {{lb.align}}; color: {{lb.color}}; white-space: nowrap; overflow: hidden">{{lb.text}}</div>
  </sc-for>

  <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="6">
    <div style="position: absolute; left: {{tb.x}}px; top: {{tb.y}}px; width: {{tb.w}}px; height: {{tb.h}}px; box-sizing: border-box; display: grid; grid-template-columns: repeat({{tb.cols}}, minmax(0, 1fr)); grid-template-rows: repeat({{tb.rows}}, minmax(0, 1fr)); border-radius: {{tb.rad}}px; border: 1px solid {{c.track}}; overflow: hidden">
      <sc-for list="{{tb.items}}" as="it" hint-placeholder-count="2">
        <button class="al-btn" type="button" aria-label="{{it.label}}" onClick="{{it.pick}}" style="display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; white-space: nowrap; font-size: {{tb.fs}}px; background: {{it.bg}}; color: {{it.fg}}">
          <sc-if value="{{it.isIcon}}" hint-placeholder-val="{{false}}">
            <svg width="{{tb.iw}}" height="{{tb.ih}}" viewBox="0 0 22 12" aria-hidden="true"><path d="{{it.icon}}" stroke="{{it.fg}}" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"></path></svg>
          </sc-if>
          <sc-if value="{{it.isText}}" hint-placeholder-val="{{true}}">{{it.label}}</sc-if>
        </button>
      </sc-for>
    </div>
  </sc-for>

  <sc-for list="{{pills}}" as="pl" hint-placeholder-count="4">
    <button class="al-btn" type="button" aria-label="{{pl.label}}" onClick="{{pl.toggle}}" style="position: absolute; left: {{pl.x}}px; top: {{pl.y}}px; width: {{pl.w}}px; height: {{pl.h}}px; border-radius: {{pl.rad}}px; border: 1px solid {{pl.border}}; background: {{pl.bg}}; color: {{pl.fg}}; text-align: center; line-height: {{pl.lh}}px; font-size: 8px; font-weight: {{pl.fw}}; letter-spacing: {{pl.ls}}; white-space: nowrap; overflow: hidden">{{pl.text}}</button>
  </sc-for>

  <sc-for list="{{numboxes}}" as="nb" hint-placeholder-count="0">
    <button class="al-btn" type="button" aria-label="{{nb.label}}" onPointerDown="{{nb.down}}" onPointerMove="{{nb.move}}" onPointerUp="{{nb.up}}" onDoubleClick="{{nb.dbl}}" style="position: absolute; left: {{nb.x}}px; top: {{nb.y}}px; width: {{nb.w}}px; height: {{nb.h}}px; border-radius: 3px; background: {{c.field}}; text-align: center; line-height: {{nb.h}}px; font-size: 9px; color: {{c.text}}; cursor: ns-resize">{{nb.text}}</button>
  </sc-for>

  <sc-for list="{{dials}}" as="d" hint-placeholder-count="12">
    <button class="al-btn" type="button" aria-label="{{d.label}}" onPointerDown="{{d.down}}" onPointerMove="{{d.move}}" onPointerUp="{{d.up}}" onDoubleClick="{{d.dbl}}" style="position: absolute; left: {{d.x}}px; top: {{d.y}}px; width: {{d.w}}px; height: {{d.h}}px; display: flex; flex-direction: column; align-items: center; cursor: ns-resize">
      <svg width="{{d.kd}}" height="{{d.kd}}" viewBox="0 0 32 32" aria-hidden="true">
        <path d="{{d.track}}" stroke="{{c.track}}" stroke-width="2.6" fill="none" stroke-linecap="round"></path>
        <path d="{{d.arc}}" stroke="{{d.color}}" stroke-width="2.6" fill="none" stroke-linecap="round"></path>
        <line x1="16" y1="16" x2="{{d.nx}}" y2="{{d.ny}}" stroke="{{d.color}}" stroke-width="1.6" stroke-linecap="round"></line>
      </svg>
      <div style="font-size: {{d.fs}}px; line-height: 10px; color: {{c.text}}; white-space: nowrap">{{d.text}}</div>
    </button>
  </sc-for>

  <sc-for list="{{cells}}" as="ce" hint-placeholder-count="0">
    <button class="al-btn" type="button" aria-label="{{ce.label}}" onPointerDown="{{ce.down}}" onPointerMove="{{ce.move}}" onPointerUp="{{ce.up}}" onDoubleClick="{{ce.dbl}}" style="position: absolute; left: {{ce.x}}px; top: {{ce.y}}px; width: 20px; height: 12px; border-radius: 2px; background: {{ce.bg}}; cursor: ns-resize; overflow: hidden">
      <div style="position: absolute; top: 2px; bottom: 2px; left: 9.5px; width: 1px; background: {{c.track}}"></div>
      <div style="position: absolute; top: 1px; bottom: 1px; left: {{ce.left}}%; width: {{ce.width}}%; background: {{ce.color}}; opacity: 0.8; border-radius: 1px"></div>
      <div style="position: absolute; left: 0; right: 0; top: 0; line-height: 12px; text-align: center; font-size: 7px; font-weight: 600; color: {{ce.fg}}">{{ce.text}}</div>
    </button>
  </sc-for>

  <sc-if value="{{showSize}}" hint-placeholder-val="{{true}}">
    <button class="al-btn" type="button" aria-label="Size" onPointerDown="{{sizeBar.down}}" onPointerMove="{{sizeBar.move}}" onPointerUp="{{sizeBar.up}}" onDoubleClick="{{sizeBar.dbl}}" style="position: absolute; left: 308px; top: 145px; width: 328px; height: 18px; border-radius: 3px; background: {{c.field}}; cursor: ew-resize; overflow: hidden">
      <div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{sizeFillPct}}%; background: {{c.sizeFill}}"></div>
      <div style="position: absolute; left: 6px; top: 0; line-height: 18px; font-size: 9px; color: {{c.text}}">Size</div>
      <div style="position: absolute; right: 6px; top: 0; line-height: 18px; font-size: 9px; color: {{c.text}}">{{sizeText}}</div>
    </button>
  </sc-if>

  <div style="position: absolute; left: 308px; top: 6px; width: 328px; height: {{dispH}}px; border-radius: 4px; background: {{c.disp}}; overflow: hidden">
    <div style="position: absolute; left: 4px; top: 3px; width: 320px; height: 12px; display: flex; align-items: center; gap: 6px; font-size: 8px; color: {{c.dlabel}}">
      <span style="font-weight: 600; letter-spacing: 0.08em">{{dispTitle}}</span>
      <span style="flex: 1; white-space: nowrap; overflow: hidden">{{dispInfo}}</span>
      <sc-if value="{{showViewIcons}}" hint-placeholder-val="{{true}}">
        <button class="al-btn" type="button" aria-label="Line view" onClick="{{setLine}}" style="width: 14px; height: 11px; display: flex; align-items: center; justify-content: center; border-radius: 2px; background: {{lineBg}}">
          <svg width="10" height="8" viewBox="0 0 10 8" aria-hidden="true"><path d="M0 1.5 H10 M0 4 H10 M0 6.5 H10" stroke="{{lineFg}}" stroke-width="1"></path></svg>
        </button>
        <button class="al-btn" type="button" aria-label="2D view" onClick="{{set2d}}" style="width: 14px; height: 11px; display: flex; align-items: center; justify-content: center; border-radius: 2px; background: {{twoBg}}">
          <svg width="10" height="8" viewBox="0 0 10 8" aria-hidden="true"><path d="M0 0 H3 V3 H0 Z M4 0 H6 V3 H4 Z M7 0 H10 V3 H7 Z M0 5 H2 V8 H0 Z M3 5 H7 V8 H3 Z M8 5 H10 V8 H8 Z" fill="{{twoFg}}"></path></svg>
        </button>
      </sc-if>
    </div>

    <sc-if value="{{showTable}}" hint-placeholder-val="{{true}}">
      <sc-for list="{{lanes}}" as="ln" hint-placeholder-count="5">
        <div onPointerDown="{{ln.down}}" onPointerMove="{{ln.move}}" onPointerUp="{{ln.up}}" onDoubleClick="{{ln.dbl}}" style="position: absolute; left: 4px; top: {{ln.top}}px; width: 320px; height: 22px; cursor: crosshair; touch-action: none; border-top: 1px solid {{ln.rule}}; box-sizing: border-box; background: {{ln.grad}}">
          <svg width="320" height="21" viewBox="0 0 320 21" style="position: absolute; left: 0; top: 0" aria-hidden="true">
            <path d="{{ln.fillD}}" fill="{{c.voice}}" stroke="none"></path>
            <path d="{{ln.stepD}}" stroke="{{c.voice}}" stroke-width="{{lineWidth}}" fill="none" stroke-linejoin="miter"></path>
            <rect x="{{ln.edgeX}}" y="0" width="{{ln.dimW}}" height="21" fill="{{c.disp}}" fill-opacity="0.62"></rect>
            <line x1="{{ln.edgeX}}" y1="0" x2="{{ln.edgeX}}" y2="21" stroke="{{c.dlabel}}" stroke-opacity="{{ln.edgeOp}}" stroke-width="1" stroke-dasharray="2 2"></line>
            <line x1="{{ln.wx}}" y1="0" x2="{{ln.wx}}" y2="21" stroke="{{ln.wColor}}" stroke-opacity="0.35" stroke-width="1"></line>
            <circle cx="{{ln.wx}}" cy="{{ln.wy}}" r="2.6" fill="{{ln.wColor}}"></circle>
            <line x1="{{ln.rx}}" y1="0" x2="{{ln.rx}}" y2="21" stroke="{{c.read}}" stroke-opacity="0.35" stroke-width="1"></line>
            <circle cx="{{ln.rx}}" cy="{{ln.ry}}" r="3" fill="none" stroke="{{c.read}}" stroke-width="1.3"></circle>
          </svg>
        </div>
      </sc-for>
      <div style="position: absolute; left: 4px; top: 130px; width: 320px; height: 4px">
        <div style="position: absolute; left: 0; right: 0; top: 1px; height: 2px; background: {{c.drule}}; border-radius: 1px"></div>
        <div style="position: absolute; left: 0; top: 1px; height: 2px; width: {{ovPct}}%; background: {{c.dlabel}}; border-radius: 1px"></div>
        <sc-for list="{{ovTicks}}" as="tk" hint-placeholder-count="5">
          <div style="position: absolute; top: 0; height: 4px; width: 1px; left: {{tk.pct}}%; background: {{c.voice}}"></div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{showCurve}}" hint-placeholder-val="{{false}}">
      <div onPointerDown="{{curve.down}}" onPointerMove="{{curve.move}}" onPointerUp="{{curve.up}}" onDoubleClick="{{curve.dbl}}" style="position: absolute; left: 4px; top: 17px; width: 320px; height: 140px; cursor: grab; touch-action: none">
        <svg width="320" height="140" viewBox="0 0 320 140" style="position: absolute; left: 0; top: 0" aria-hidden="true">
          <rect x="{{curve.band.x}}" y="0" width="{{curve.band.w}}" height="126" fill="{{curve.band.fill}}" fill-opacity="{{curve.band.op}}"></rect>
          <path d="{{curve.grid}}" stroke="{{c.drule}}" stroke-width="1" fill="none"></path>
          <path d="{{curve.zero}}" stroke="{{c.track}}" stroke-width="1" fill="none"></path>
          <path d="{{curve.voices}}" stroke="{{c.voice}}" stroke-opacity="0.28" stroke-width="1" fill="none"></path>
          <path d="{{curve.fill}}" fill="{{c.write}}" fill-opacity="0.07" stroke="none"></path>
          <path d="{{curve.d}}" stroke="{{c.write}}" stroke-width="{{lineWidth}}" fill="none"></path>
          <line x1="{{curve.band.x}}" y1="0" x2="{{curve.band.x}}" y2="126" stroke="{{curve.band.fill}}" stroke-opacity="0.6" stroke-width="1"></line>
          <line x1="{{curve.band.x2}}" y1="0" x2="{{curve.band.x2}}" y2="126" stroke="{{curve.band.fill}}" stroke-opacity="0.6" stroke-width="1"></line>
          <rect x="{{curve.band.gx1}}" y="2" width="6" height="12" rx="2" fill="{{c.disp}}" stroke="{{curve.band.fill}}" stroke-width="1.2"></rect>
          <rect x="{{curve.band.gx2}}" y="2" width="6" height="12" rx="2" fill="{{c.disp}}" stroke="{{curve.band.fill}}" stroke-width="1.2"></rect>
          <circle cx="{{curve.ctr.x}}" cy="{{curve.ctr.y}}" r="5" fill="{{c.disp}}" stroke="{{c.write}}" stroke-width="1.5"></circle>
          <rect x="{{curve.rs.x0}}" y="{{curve.rs.y0}}" width="9" height="9" rx="1" fill="{{c.disp}}" stroke="{{c.read}}" stroke-width="1.4" stroke-opacity="{{curve.rs.op}}"></rect>
          <text x="{{curve.band.lx}}" y="24" font-size="8" fill="{{c.dlabel}}">{{curve.band.label}}</text>
          <text x="{{curve.rs.tx}}" y="{{curve.rs.ty}}" font-size="8" fill="{{c.dlabel}}">R</text>
          <text x="2" y="136" font-size="7" fill="{{c.dlabel}}">20</text>
          <text x="96" y="136" font-size="7" fill="{{c.dlabel}}">200</text>
          <text x="198" y="136" font-size="7" fill="{{c.dlabel}}">2k</text>
          <text x="300" y="136" font-size="7" fill="{{c.dlabel}}">20k</text>
        </svg>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{isLfo}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; left: 858px; top: 52px; width: 102px; height: 10px; border-radius: 2px; background: {{c.field}}; overflow: hidden">
      <div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{envPct}}%; background: {{c.meter}}"></div>
    </div>
  </sc-if>

  <sc-if value="{{isOut}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 942px; top: 29px; width: 18px; height: 132px; display: flex; gap: 2px; align-items: flex-end">
      <div style="position: relative; flex: 1; height: 132px; background: {{c.field}}; border-radius: 1px">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{meterL}}%; background: {{c.meter}}; border-radius: 1px"></div>
      </div>
      <div style="position: relative; flex: 1; height: 132px; background: {{c.field}}; border-radius: 1px">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{meterR}}%; background: {{c.meter}}; border-radius: 1px"></div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["Graphite","Sand","Ice"],"default":"Graphite","section":"Look"},"theme":{"editor":"enum","options":["Dark","Light"],"default":"Light","section":"Look"},"panels":{"editor":"enum","options":["Auto","Darker","Lighter","Off"],"default":"Auto","section":"Look"},"lineWeight":{"editor":"range","min":0.75,"max":2,"step":0.25,"default":1,"section":"Look"},"animate":{"editor":"boolean","default":true,"section":"Behaviour"},"sizeMod":{"editor":"boolean","default":true,"section":"Behaviour"},"demoMatrix":{"editor":"boolean","default":true,"section":"Behaviour"},"$preview":{"width":968,"height":169}}'>
// v0.3 face layout table: the single source for the mock-up (embedded) and layout.md (generated).
// r = [x, y, w, h] in face coordinates (968 x 169). page: lfo | mod | tone | out | tbl (hidden on Tone) | null.
// cond: w_free | w_sync | r_free | r_sync | l1_hz | l1_sy | l2_hz | l2_sy | ws:<shapes> (Sym label per write shape).
const SRCS = [['l1', 'LFO 1'], ['l2', 'LFO 2'], ['en', 'Env'], ['dr', 'Drift'], ['ve', 'Velocity'], ['mw', 'Mod Wheel'], ['vo', 'Voice'], ['nb', 'Neighbour'], ['ro', 'Read Osc']];
// grouped column order: write | read | table | tone | out
const TGTS = [['wp', 'W Pit', 0, 'write'], ['sy', 'Sym', 0, 'write'], ['wa', 'Write', 0, 'write'], ['rp', 'R Pit', 1, 'read'], ['sp', 'Sprd', 1, 'read'],
  ['sz', 'Size', 2, 'label'], ['dv', 'Drive', 3, 'label'], ['bc', 'Ctr', 3, 'label'], ['bw', 'Wid', 3, 'label'], ['rf', 'R Frq', 3, 'label'], ['rb', 'R Fb', 3, 'label'], ['ou', 'Out', 4, 'label']];
const TGT_LONG = { wp: 'Write Pitch', sy: 'Write Sym', wa: 'Write', rp: 'Read Pitch', sp: 'Read Spread', sz: 'Size', dv: 'Drive', bc: 'Band Center', bw: 'Band Width', rf: 'Res Freq', rb: 'Res Fdbk', ou: 'Output' };
const W_SHAPES = [['Ramp', 'ramp'], ['Tri', 'tri'], ['Tri ±', 'tripm'], ['Sine', 'sine'], ['Pulse', 'pulse'], ['Pulsar', 'pulsar'], ['Spike', 'spike'], ['Noise', 'noise']];
const LFO_SHAPES = [['Sine', 'lsine'], ['Tri', 'ltri'], ['Saw', 'saw'], ['Square', 'sq'], ['S&H', 'sh'], ['Random', 'rnd']];

function buildLayout() {
  const L = [];
  const add = (o) => { L.push(o); return o; };
  // ---- panels ----
  add({ id: 'panel_w', cls: 'panel', kind: 'panel', r: [4, 4, 300, 79], note: 'Write section surface' });
  add({ id: 'panel_r', cls: 'panel', kind: 'panel', r: [4, 86, 300, 79], note: 'Read section surface' });
  add({ id: 'panel_disp', cls: 'panel', kind: 'panel', r: [306, 4, 332, 161], note: 'display + Size slider surface' });
  add({ id: 'panel_page', cls: 'panel', kind: 'panel', r: [642, 4, 322, 161], note: 'page area surface' });

  // ---- pointer rows ----
  for (const [p, name, dy] of [['w', 'WRITE', 0], ['r', 'READ', 82]]) {
    const acc = p === 'w' ? 'write' : 'read';
    add({ id: `${p}_title`, cls: 'live.comment', kind: 'label', r: [10, 11 + dy, 52, 13], text: name, bold: true, fs: 9, role: 'text' });
    add({ id: `${p}_mode`, cls: 'live.tab', kind: 'tab', r: [10, 28 + dy, 52, 14], key: `${p}_mode`, items: ['Hz', 'Sync'], param: `${name[0]}${name.slice(1).toLowerCase()} Mode` });
    add({ id: `${p}_sync_mult`, cls: 'live.numbox', kind: 'numbox', r: [10, 46 + dy, 25, 14], key: `${p}_mult`, cond: `${p}_sync`, fmt: 'mult', note: 'x 1-128 (units "×%d")' });
    add({ id: `${p}_sync_div`, cls: 'live.numbox', kind: 'numbox', r: [37, 46 + dy, 25, 14], key: `${p}_dv`, cond: `${p}_sync`, fmt: 'dv', note: '÷ 1-32 (units "÷%d")' });
    add({ id: `${p}_free_lbl1`, cls: 'live.comment', kind: 'label', r: [66, 11 + dy, 40, 11], text: 'Pitch', cond: `${p}_free`, align: 'center' });
    add({ id: `${p}_sync_lbl1`, cls: 'live.comment', kind: 'label', r: [66, 11 + dy, 40, 11], text: 'Rate', cond: `${p}_sync`, align: 'center' });
    add({ id: `${p}_free_lbl2`, cls: 'live.comment', kind: 'label', r: [106, 11 + dy, 40, 11], text: 'Fine', cond: `${p}_free`, align: 'center' });
    add({ id: `${p}_sync_lbl2`, cls: 'live.comment', kind: 'label', r: [106, 11 + dy, 40, 11], text: 'Detune', cond: `${p}_sync`, align: 'center' });
    add({ id: `${p}_free_pitch`, cls: 'live.dial', kind: 'dial', r: [66, 22 + dy, 40, 45], key: `${p}_pitch`, cond: `${p}_free`, color: acc, fmt: 'semi', note: '−64…+130 st, default 0, steps 195' });
    add({ id: `${p}_sync_note`, cls: 'live.dial', kind: 'dial', r: [66, 22 + dy, 40, 45], key: `${p}_div`, cond: `${p}_sync`, color: acc, fmt: 'div', note: 'note value enum (19)' });
    add({ id: `${p}_fine`, cls: 'live.dial', kind: 'dial', r: [106, 22 + dy, 40, 45], key: `${p}_fine`, color: acc, fmt: 'st3', note: '−1…+1 st, default 0, steps 2001' });
    if (p === 'w') {
      for (const [lbl, shapes] of [['Curve', 'ramp'], ['Skew', 'tri,tripm,sine'], ['Width', 'pulse,spike'], ['Duty', 'pulsar'], ['Smooth', 'noise']]) {
        add({ id: `w_symlbl_${lbl.toLowerCase()}`, cls: 'live.comment', kind: 'label', r: [146, 11, 40, 11], text: lbl, cond: `ws:${shapes}`, align: 'center', note: `shown for ${shapes}` });
      }
      add({ id: 'w_sym', cls: 'live.dial', kind: 'dial', r: [146, 22, 40, 45], key: 'w_sym', color: acc, fmt: 'sym', note: '−1…+1, 0.01 grid (201 steps)' });
      add({ id: 'w_shapelbl', cls: 'live.comment', kind: 'label', r: [190, 11, 60, 11], text: 'Shape' });
      add({ id: 'w_shape', cls: 'live.tab', kind: 'tab', r: [190, 23, 108, 32], key: 'w_shape', icons: W_SHAPES, rows: 2, note: '2 rows × 4 icons (num_lines 2)' });
      add({ id: 'w_active', cls: 'live.tab', kind: 'tab', r: [190, 59, 108, 14], key: 'w_active', items: ['Freeze', 'Write', 'Clean'], note: 'Write State, default Write' });
    } else {
      add({ id: 'r_lbl3', cls: 'live.comment', kind: 'label', r: [146, 93, 40, 11], text: 'Spread', align: 'center' });
      add({ id: 'r_spread', cls: 'live.dial', kind: 'dial', r: [146, 104, 40, 45], key: 'r_spread', color: acc, fmt: 'spread' });
      add({ id: 'r_shapelbl', cls: 'live.comment', kind: 'label', r: [190, 93, 60, 11], text: 'Shape' });
      add({ id: 'r_shape', cls: 'live.tab', kind: 'tab', r: [190, 105, 108, 18], key: 'r_shape', icons: [['Ramp', 'ramp'], ['Tri', 'tri']], rows: 1 });
      add({ id: 'r_smooth', cls: 'live.text', kind: 'pill', r: [190, 127, 52, 14], key: 'r_smooth', text: 'Smooth', color: acc });
      add({ id: 'r_dir', cls: 'live.text', kind: 'pill', r: [246, 127, 52, 14], key: 'r_dir', text: '1-Way', texton: '2-Way', color: acc });
    }
  }

  // ---- display + Size ----
  add({ id: 'display', cls: 'v8ui', kind: 'display', r: [308, 6, 328, 136], note: 'aliasing_display.js; header 3–15, lanes 17–127 (5 × 22), overview 130–134; on Tone the box is 308 6 328 157 (y 6–163), curve rect x 4 y 17 w 320 h = box h − 31, frequency labels below' });
  add({ id: 'tbl_size', cls: 'live.slider', kind: 'slider', r: [308, 145, 328, 18], key: 'size', page: 'tbl', note: 'horizontal, showname 0, shownumber 0 (painter draws "Size" and the value)' });

  // ---- page tabs ----
  add({ id: 'page', cls: 'live.tab', kind: 'tab', r: [646, 8, 314, 16], key: 'page', items: ['LFO · Env', 'Mod', 'Tone', 'Global'], note: 'stored only' });

  // ---- LFO · Env ----
  for (const k of [1, 2]) {

    const lanes = []; for (let v = 0; v < NV; v++) lanes.push(this.lane(v, c));
    return {
      c: c, panels: panels,
      vlines: of('vline').map((e) => ({ x: e.r[0], y: e.r[1], h: e.r[3] })),
      labels: of('label').map((e) => this.label(e, c)),
      tabs: of('tab').map((e) => this.tab(e, c)),
      pills: of('pill').concat(of('title')).map((e) => this.pill(e, c)).concat(of('button').map((e) => this.button(e, c))),
      numboxes: of('numbox').map((e) => this.numbox(e, c)),
      dials: of('dial').map((e) => this.dial(e, c)),
      cells: of('cell').map((e) => this.cell(e, c)),
      showSize: !isTone, dispH: isTone ? 157 : 136, sizeBar: sizeBar, sizeFillPct: (sizeNorm * 100).toFixed(1), sizeText: (p.size * 100).toFixed(1) + ' %',
      isLfo: p.page === 0, isOut: p.page === 3, envPct: (this.env * 100).toFixed(0),
      showTable: !isTone, showCurve: isTone, showViewIcons: !isTone, curve: this.curveModel(c),
      dispTitle: isTone ? 'TONE' : 'TABLE',
      dispInfo: isTone ? 'drag band · edges = width · dbl-click = Pass/Reject · R' : (span + ' cells · W ' + hz(fw) + ' · R ' + hz(fr) + ((this.props.sizeMod ?? true) ? ' · Size mod (demo)' : '')),
      lanes: lanes, lineWidth: this.props.lineWeight ?? 1,
      ovPct: (p.size * 100).toFixed(2), ovTicks: this.eff.map((e) => ({ pct: Math.min(99.7, e * 100).toFixed(2) })),
      lineBg: p.view ? 'transparent' : c.sel, lineFg: p.view ? c.dlabel : c.selFg, twoBg: p.view ? c.sel : 'transparent', twoFg: p.view ? c.selFg : c.dlabel,
      setLine: () => this.set('view', 0), set2d: () => this.set('view', 1),
      meterL: this.meter[0].toFixed(0), meterR: this.meter[1].toFixed(0)
    };
  }
}
</script>

[project]
name = "m4l-tools"
version = "0.1.0"
description = "Offline tools for the m4l-workbench: audio analysis, spectral A/B, null tests, test-patch generation"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy>=2.5",
    "scipy>=1.18",
    "soundfile>=0.14",
    "matplotlib>=3.11",
    "py2max==0.6.0",
]

[project.scripts]
m4l-analyze = "m4l_tools.analyze:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m4l_tools"]
